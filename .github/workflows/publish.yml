name: Publish

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version_check
        shell: bash
        run: |
          changed="$(bash ./.github/scripts/version-changed.sh "${{ github.event.before }}")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.version_check.outputs.changed == 'true'
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
      - if: steps.version_check.outputs.changed == 'true'
        run: npm ci
      - if: steps.version_check.outputs.changed == 'true'
        run: npm run build
      - if: steps.version_check.outputs.changed == 'true'
        run: npm publish
